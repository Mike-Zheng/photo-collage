<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0b76c4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Photo Collage</title>
    <script>
      // 載入前先套用主題，避免深色模式閃白
      ;(function () {
        try {
          var t = localStorage.getItem('collage.theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/photo-collage/assets/index-CG12R7Ny.js"></script>
    <link rel="stylesheet" crossorigin href="/photo-collage/assets/index-Cr-oI1WX.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
